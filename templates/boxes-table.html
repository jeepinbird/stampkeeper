{{define "boxes-table"}}
<div class="table-responsive">
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Name</th>
                <th>Stamp Count</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="boxes-table-body">
            {{range .AllBoxes}}
            {{template "box-row" .}}
            {{end}}
        </tbody>
    </table>
</div>
{{end}}

{{define "box-row"}}
<tr data-box-id="{{.ID}}">
    <td>{{.Name}}</td>
    <td>{{.StampCount}}</td>
    <td>
        <button hx-get="/htmx/boxes/{{.ID}}/edit"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-pencil"></i>
        </button>
        {{if eq .StampCount 0}}
        <button hx-delete="/htmx/boxes/{{.ID}}"
                hx-confirm="Delete box '{{.Name}}'?"
                hx-target="#boxes-table-container"
                class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i>
        </button>
        {{else}}
        <button class="btn btn-sm btn-outline-secondary"
                disabled
                title="Can't delete - box contains stamps">
            <i class="bi bi-trash"></i>
        </button>
        {{end}}
    </td>
</tr>
{{end}}

{{define "box-row-edit"}}
<tr data-box-id="{{.ID}}">
    <td>
        <form hx-put="/htmx/boxes/{{.ID}}"
              hx-target="closest tr"
              hx-swap="outerHTML">
            <input type="text"
                   name="name"
                   value="{{.Name}}"
                   class="form-control"
                   required
                   autofocus>
        </form>
    </td>
    <td>{{.StampCount}}</td>
    <td>
        <button type="submit"
                form="box-form-{{.ID}}"
                hx-put="/htmx/boxes/{{.ID}}"
                hx-include="closest tr input[name='name']"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-check"></i>
        </button>
        <button hx-get="/htmx/boxes/{{.ID}}/cancel"
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-x"></i>
        </button>
        {{if eq .StampCount 0}}
        <button hx-delete="/htmx/boxes/{{.ID}}"
                hx-confirm="Delete box '{{.Name}}'?"
                hx-target="#boxes-table-container"
                class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i>
        </button>
        {{else}}
        <button class="btn btn-sm btn-outline-secondary"
                disabled
                title="Can't delete - box contains stamps">
            <i class="bi bi-trash"></i>
        </button>
        {{end}}
    </td>
</tr>
{{end}}

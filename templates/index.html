<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StampKeeper</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/static/css/mobile-base.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    <link rel="stylesheet" href="/static/css/stamp-detail.css">
    <link rel="stylesheet" href="/static/css/settings.css">

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="container-fluid">
        <div class="row g-0">

            <!-- Mobile Sidebar Overlay -->
            <div class="mobile-sidebar-overlay" id="mobileOverlay"></div>

            <nav class="col-lg-2 col-md-3 d-md-block sidebar mobile-drawer" id="mobileSidebar">
                <div class="sidebar-sticky">
                    <a href="#" class="app-title text-decoration-none"
                       onclick="navigateToDefaultView(); return false;">
                        <i class="bi bi-postage"></i>
                        <span>StampKeeper</span>
                    </a>

                    <div class="sidebar-section" 
                        hx-target="#stamp-view-content" 
                        hx-swap="innerHTML"
                        hx-indicator="#loading-spinner">
                        <h6 class="sidebar-heading">Quick Filters</h6>
                        <div class="btn-group-vertical w-100" role="group">
                            <input type="radio" class="btn-check" name="owned_filter" id="filter_all" autocomplete="off" checked value="all"
                                hx-get="/views/stamps/{{.Preferences.DefaultView}}" 
                                hx-trigger="change"
                                hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                            <label class="btn btn-outline-secondary text-start" for="filter_all">All Stamps</label>

                            <input type="radio" class="btn-check" name="owned_filter" id="filter_owned" autocomplete="off" value="true"
                                hx-get="/views/stamps/{{.Preferences.DefaultView}}" 
                                hx-trigger="change"
                                hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                            <label class="btn btn-outline-secondary text-start" for="filter_owned">Owned</label>
                            
                            <input type="radio" class="btn-check" name="owned_filter" id="filter_needed" autocomplete="off" value="false"
                                hx-get="/views/stamps/{{.Preferences.DefaultView}}" 
                                hx-trigger="change"
                                hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                            <label class="btn btn-outline-secondary text-start" for="filter_needed">Needed</label>
                        </div>
                    </div>

                    <div class="sidebar-section">
                        <h6 class="sidebar-heading">Jump To Scott #</h6>
                        <div class="jump-to-container">
                            <div class="jump-to-input-wrapper">
                                <input type="number" 
                                       class="form-control form-control-sm" 
                                       name="jump_to" 
                                       placeholder="e.g. 4000"
                                       min="1"
                                       hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                                       hx-trigger="keyup changed delay:500ms"
                                       hx-target="#stamp-view-content"
                                       hx-indicator="#loading-spinner"
                                       hx-include="[name='search'], [name='owned_filter']:checked, #box-list .list-group-item.active">
                                <button type="button" class="jump-to-clear-btn" title="Clear jump to filter"
                                        onclick="clearJumpTo()"
                                        style="display: none;">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                            <small class="form-text text-muted">Shows stamps with Scott # ≥ this value</small>
                        </div>
                    </div>

                    <div class="sidebar-section">
                        <h6 class="sidebar-heading">Storage Boxes</h6>
                        <div id="box-list"
                             hx-get="/views/boxes-list"
                             hx-trigger="load, newBoxAdded from:body"
                             hx-swap="innerHTML">
                            <div class="text-center"><div class="spinner-border spinner-border-sm" role="status"></div></div>
                        </div>
                    </div>

                    <!-- Settings Button at Bottom -->
                    <div class="settings-btn-bottom">
                        <button class="btn d-flex align-items-center"
                                hx-get="/views/settings"
                                hx-target="#stamp-view-content"
                                hx-swap="innerHTML"
                                hx-indicator="#loading-spinner">
                            <i class="bi bi-gear-fill me-2"></i>Settings
                        </button>
                    </div>
                </div>
            </nav>

            <main class="col-lg-10 col-md-9 ms-sm-auto px-md-4">
                <header class="main-header">
                    <!-- Mobile Menu Toggle -->
                    <button class="mobile-menu-toggle show-mobile-flex" id="mobileMenuToggle" aria-label="Open menu">
                        <i class="bi bi-list"></i>
                    </button>

                    <div class="search-container">
                        <i class="bi bi-search search-icon"></i>
                        <input class="form-control" type="search" name="search"
                               placeholder="Search by Stamp Name or Scott No..."
                               hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                               hx-trigger="keyup changed delay:500ms, search"
                               hx-target="#stamp-view-content"
                               hx-indicator="#loading-spinner"
                               hx-include="[name='jump_to'], [name='owned_filter']:checked, #box-list .list-group-item.active">
                    </div>
                    <div class="settings-container d-flex gap-3 align-items-center">
                        <!-- View Toggle Buttons -->
                        <div class="view-toggles">
                            <div class="btn-group" role="group" aria-label="View toggle">
                                <input type="radio" class="btn-check" name="view_toggle" id="view_gallery" autocomplete="off" {{if eq .Preferences.DefaultView "gallery"}}checked{{end}}>
                                <label class="btn btn-outline-secondary" for="view_gallery" 
                                       hx-get="/views/stamps/gallery" 
                                       hx-target="#stamp-view-content"
                                       hx-trigger="click"
                                       hx-indicator="#loading-spinner"
                                       hx-include="[name='search'], [name='jump_to'], [name='owned_filter']:checked, #box-list .list-group-item.active">
                                    <i class="bi bi-grid-3x3-gap"></i> Gallery
                                </label>

                                <input type="radio" class="btn-check" name="view_toggle" id="view_list" autocomplete="off" {{if eq .Preferences.DefaultView "list"}}checked{{end}}>
                                <label class="btn btn-outline-secondary" for="view_list"
                                       hx-get="/views/stamps/list" 
                                       hx-target="#stamp-view-content"
                                       hx-trigger="click"
                                       hx-indicator="#loading-spinner"
                                       hx-include="[name='search'], [name='jump_to'], [name='owned_filter']:checked, #box-list .list-group-item.active">
                                    <i class="bi bi-list-ul"></i> List
                                </label>
                            </div>
                        </div>
                    </div>
                </header>

                <div id="stamp-view" class="mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="view-title">My Collection</h2>
                        <div class="view-status">
                           <span id="loading-spinner" class="htmx-indicator spinner-border spinner-border-sm" role="status"></span>
                        </div>
                    </div>
                    <div id="stamp-view-content">
                        <!-- Content will be loaded by JavaScript based on user preferences -->
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <button class="add-stamp-btn"
            id="addStampBtn"
            title="Add New Stamp"
            hx-get="/views/stamps/new"
            hx-target="#stamp-view-content"
            hx-swap="innerHTML"
            hx-indicator="#loading-spinner">
        +
    </button>

    <!-- Bottom Navigation (Mobile Only) -->
    <nav class="bottom-nav">
        <button class="bottom-nav-item active" id="bottomNavBrowse"
                onclick="navigateToDefaultView(); setActiveBottomNav('bottomNavBrowse')">
            <i class="bi bi-grid-3x3-gap"></i>
            <span>Browse</span>
        </button>
        <button class="bottom-nav-item" id="bottomNavAdd"
                onclick="document.getElementById('addStampBtn').click(); setActiveBottomNav('bottomNavAdd')">
            <i class="bi bi-plus-circle"></i>
            <span>Add</span>
        </button>
        <button class="bottom-nav-item" id="bottomNavSearch"
                onclick="document.querySelector('[name=search]').focus(); setActiveBottomNav('bottomNavSearch')">
            <i class="bi bi-search"></i>
            <span>Search</span>
        </button>
        <button class="bottom-nav-item" id="bottomNavFilter"
                onclick="toggleMobileFilters(); setActiveBottomNav('bottomNavFilter')">
            <i class="bi bi-funnel"></i>
            <span>Filter</span>
        </button>
    </nav>

    <!-- Mobile Filter Panel (slides up from bottom) -->
    <div class="mobile-filter-panel" id="mobileFilterPanel">
        <div class="mobile-filter-panel-header">
            <h3 class="mobile-filter-panel-title">Filters</h3>
            <button class="mobile-filter-panel-close" onclick="toggleMobileFilters()" aria-label="Close filters">
                <i class="bi bi-x"></i>
            </button>
        </div>

        <!-- Quick Filters -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">Quick Filters</h6>
            <div class="btn-group-vertical w-100" role="group"
                 hx-target="#stamp-view-content"
                 hx-swap="innerHTML"
                 hx-indicator="#loading-spinner">
                <input type="radio" class="btn-check" name="mobile_owned_filter" id="mobile_filter_all" autocomplete="off" checked value="all"
                    hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                    hx-trigger="change"
                    hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                <label class="btn btn-outline-secondary text-start" for="mobile_filter_all">All Stamps</label>

                <input type="radio" class="btn-check" name="mobile_owned_filter" id="mobile_filter_owned" autocomplete="off" value="true"
                    hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                    hx-trigger="change"
                    hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                <label class="btn btn-outline-secondary text-start" for="mobile_filter_owned">Owned</label>

                <input type="radio" class="btn-check" name="mobile_owned_filter" id="mobile_filter_needed" autocomplete="off" value="false"
                    hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                    hx-trigger="change"
                    hx-include="[name='search'], [name='jump_to'], #box-list .list-group-item.active">
                <label class="btn btn-outline-secondary text-start" for="mobile_filter_needed">Needed</label>
            </div>
        </div>

        <!-- Jump To Scott # -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">Jump To Scott #</h6>
            <div class="jump-to-container">
                <div class="jump-to-input-wrapper">
                    <input type="number"
                           class="form-control"
                           name="mobile_jump_to"
                           placeholder="e.g. 4000"
                           min="1"
                           hx-get="/views/stamps/{{.Preferences.DefaultView}}"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#stamp-view-content"
                           hx-indicator="#loading-spinner"
                           hx-include="[name='search'], [name='mobile_owned_filter']:checked, #mobile-box-list .list-group-item.active">
                    <button type="button" class="jump-to-clear-btn" title="Clear jump to filter"
                            onclick="clearMobileJumpTo()"
                            style="display: none;">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
                <small class="form-text text-muted">Shows stamps with Scott # ≥ this value</small>
            </div>
        </div>

        <!-- Storage Boxes -->
        <div class="sidebar-section">
            <h6 class="sidebar-heading">Storage Boxes</h6>
            <div id="mobile-box-list"
                 hx-get="/views/boxes-list"
                 hx-trigger="load, newBoxAdded from:body"
                 hx-swap="innerHTML">
                <div class="text-center"><div class="spinner-border spinner-border-sm" role="status"></div></div>
            </div>
        </div>

        <!-- Settings Button -->
        <div class="sidebar-section">
            <button class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center"
                    hx-get="/views/settings"
                    hx-target="#stamp-view-content"
                    hx-swap="innerHTML"
                    hx-indicator="#loading-spinner"
                    onclick="toggleMobileFilters()">
                <i class="bi bi-gear-fill me-2"></i>Settings
            </button>
        </div>
    </div>

    <script>
        // Minimal JavaScript - only for essential UI interactions
        // Most functionality now handled by HTMX + Go server-side

        // === Mobile Navigation Functions ===

        // Toggle mobile sidebar drawer
        const mobileSidebar = document.getElementById('mobileSidebar');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');

        function toggleMobileSidebar() {
            mobileSidebar.classList.toggle('active');
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = mobileSidebar.classList.contains('active') ? 'hidden' : '';
        }

        function closeMobileSidebar() {
            mobileSidebar.classList.remove('active');
            mobileOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Hamburger menu toggle
        if (mobileMenuToggle) {
            mobileMenuToggle.addEventListener('click', toggleMobileSidebar);
        }

        // Close sidebar when overlay is clicked
        if (mobileOverlay) {
            mobileOverlay.addEventListener('click', closeMobileSidebar);
        }

        // Close sidebar when a filter is selected (mobile UX)
        if (mobileSidebar) {
            mobileSidebar.addEventListener('click', function(evt) {
                // Close drawer when clicking on filter options or boxes
                if (evt.target.classList.contains('btn') ||
                    evt.target.classList.contains('list-group-item') ||
                    evt.target.closest('.list-group-item')) {
                    setTimeout(closeMobileSidebar, 300); // Delay to allow HTMX to trigger
                }
            });
        }

        // Toggle mobile filter panel
        const mobileFilterPanel = document.getElementById('mobileFilterPanel');

        window.toggleMobileFilters = function() {
            const isActive = mobileFilterPanel.classList.toggle('active');
            mobileOverlay.classList.toggle('active', isActive);
            document.body.style.overflow = isActive ? 'hidden' : '';
        };

        // Close filter panel when overlay clicked
        if (mobileOverlay) {
            mobileOverlay.addEventListener('click', function() {
                if (mobileFilterPanel.classList.contains('active')) {
                    toggleMobileFilters();
                }
            });
        }

        // Set active bottom nav item
        window.setActiveBottomNav = function(activeId) {
            document.querySelectorAll('.bottom-nav-item').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.getElementById(activeId);
            if (activeItem) {
                activeItem.classList.add('active');
            }
        };

        // Clear mobile jump-to filter
        window.clearMobileJumpTo = function() {
            const jumpToInput = document.querySelector('[name="mobile_jump_to"]');
            const clearBtn = jumpToInput ? jumpToInput.parentElement.querySelector('.jump-to-clear-btn') : null;

            if (jumpToInput) {
                jumpToInput.value = '';
                jumpToInput.dispatchEvent(new Event('keyup')); // Trigger HTMX request
                if (clearBtn) {
                    clearBtn.style.display = 'none';
                }
            }
        };

        // Show/hide clear button for mobile jump-to based on input value
        document.addEventListener('input', function(evt) {
            if (evt.target.name === 'mobile_jump_to') {
                const clearBtn = evt.target.parentElement.querySelector('.jump-to-clear-btn');
                if (clearBtn) {
                    clearBtn.style.display = evt.target.value ? 'flex' : 'none';
                }
            }
        });

        // === End Mobile Navigation Functions ===

        // Add active class to sidebar links (pure UI interaction)
        document.body.addEventListener('click', function(evt) {
            const target = evt.target.closest('.list-group-item');
            if (!target || !target.parentElement || target.parentElement.id !== 'box-list') return;

            // Remove active class from all siblings
            const siblings = target.parentElement.querySelectorAll('.list-group-item');
            siblings.forEach(el => el.classList.remove('active'));

            // Add active class to the clicked one
            target.classList.add('active');
        });

        // Load user's preferred default view on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Give HTMX a moment to fully initialize before loading content
            setTimeout(function() {
                htmx.ajax('GET', '/views/default', '#stamp-view-content');
            }, 100);
        });

        // Global function for "Back to Collection" buttons
        window.backToCollection = function() {
            // Use server-side preferences to determine default view
            htmx.ajax('GET', '/views/default', '#stamp-view-content');
        };

        // Jump-to clear functionality
        window.clearJumpTo = function() {
            const jumpToInput = document.querySelector('[name="jump_to"]');
            const clearBtn = document.querySelector('.jump-to-clear-btn');
            
            if (jumpToInput) {
                jumpToInput.value = '';
                jumpToInput.dispatchEvent(new Event('keyup')); // Trigger HTMX request
                if (clearBtn) {
                    clearBtn.style.display = 'none';
                }
            }
        };

        // Show/hide clear button based on input value
        document.addEventListener('input', function(evt) {
            if (evt.target.name === 'jump_to') {
                const clearBtn = document.querySelector('.jump-to-clear-btn');
                if (clearBtn) {
                    clearBtn.style.display = evt.target.value ? 'flex' : 'none';
                }
            }
        });
    </script>
    
    <script src="/static/js/alpine-components.js"></script>
</body>
</html>

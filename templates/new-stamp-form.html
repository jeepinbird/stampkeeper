<div class="stamp-detail-container">
    <!-- Back button -->
    <div class="mb-3">
        <button class="btn btn-outline-secondary"
                hx-get="/views/default"
                hx-target="#stamp-view-content"
                hx-swap="innerHTML"
                hx-include="[name='search'], [name='jump_to'], [name='owned_filter']:checked, #box-list .list-group-item.active">
            <i class="bi bi-arrow-left"></i> Back to Collection
        </button>
    </div>

    <!-- Create Stamp Form -->
    <form id="new-stamp-form"
          hx-post="/htmx/stamps"
          hx-target="#stamp-view-content"
          hx-swap="innerHTML"
          hx-indicator="#submit-indicator">
        <div class="row">
            <!-- Image Column -->
            <div class="col-lg-5 col-md-6 mb-4">
                <div class="stamp-detail-image-container">
                    <div class="stamp-detail-placeholder">
                        <i class="bi bi-image" style="font-size: 3rem; opacity: 0.3;"></i>
                        <p class="text-muted mt-2">You can add an image after creating the stamp</p>
                    </div>
                </div>
            </div>

            <!-- Details Column -->
            <div class="col-lg-7 col-md-6">
                <div class="stamp-detail-info">
                    <!-- Header with Required Fields -->
                    <div class="stamp-detail-header mb-4">
                        <div class="form-group mb-3">
                            <label for="stamp-name" class="form-label">Stamp Name <span class="text-danger">*</span></label>
                            <input type="text"
                                   id="stamp-name"
                                   name="name"
                                   class="form-control form-control-lg"
                                   placeholder="Enter stamp name..."
                                   required
                                   autofocus>
                        </div>
                        <div class="form-group">
                            <label for="scott-number" class="form-label">Scott Number</label>
                            <input type="text"
                                   id="scott-number"
                                   name="scott_number"
                                   class="form-control"
                                   placeholder="Enter Scott number (optional)">
                        </div>
                    </div>

                    <!-- Stamp Information Grid -->
                    <div class="stamp-info-grid">
                        <div class="info-item">
                            <label class="info-label" for="issue-date">Issue Date</label>
                            <input type="date"
                                   id="issue-date"
                                   name="issue_date"
                                   class="form-control">
                        </div>

                        <div class="info-item">
                            <label class="info-label" for="series">Series</label>
                            <input type="text"
                                   id="series"
                                   name="series"
                                   class="form-control"
                                   placeholder="Enter series (optional)">
                        </div>

                        <div class="info-item">
                            <label class="info-label">Collection Status</label>
                            <div class="status-display">
                                <span class="status-badge needed">
                                    <i class="bi bi-exclamation-circle"></i> Needed
                                </span>
                            </div>
                        </div>

                        <div class="info-item">
                            <label class="info-label">Total Copies</label>
                            <div class="total-copies-display">
                                <span class="copies-count">0 copies</span>
                            </div>
                        </div>
                    </div>

                    <!-- Notes Section -->
                    <div class="form-group mt-4">
                        <label class="info-label" for="notes">Notes</label>
                        <textarea id="notes"
                                  name="notes"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Add any notes about this stamp (optional)"></textarea>
                    </div>

                    <!-- Tags Section -->
                    <div class="form-group mt-4">
                        <label class="info-label">Tags</label>
                        <div id="tags-container">
                            <div class="tag-input-row mb-2">
                                <input type="text"
                                       name="tags"
                                       class="form-control form-control-sm"
                                       placeholder="Enter a tag (optional)">
                            </div>
                        </div>
                        <button type="button"
                                class="btn btn-sm btn-outline-secondary mt-2"
                                hx-get="/htmx/tag-input-row"
                                hx-target="#tags-container"
                                hx-swap="beforeend">
                            <i class="bi bi-plus"></i> Add Another Tag
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    <strong>Getting Started:</strong> Fill in the stamp name (required) and any additional information.
                    Click "Create Stamp" when ready. You can add copies and images after creation.
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="stamp-actions mt-4">
            <button type="submit" class="btn btn-edit">
                <span id="submit-indicator" class="htmx-indicator">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                </span>
                <i class="bi bi-plus-circle"></i> Create Stamp
            </button>
            <button type="button"
                    class="btn btn-delete"
                    hx-get="/views/default"
                    hx-target="#stamp-view-content"
                    hx-swap="innerHTML">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
        </div>
    </form>
</div>

<style>
.tag-input-row {
    display: flex;
    align-items: center;
}

.htmx-indicator {
    display: none;
}

.htmx-request .htmx-indicator {
    display: inline;
}

.htmx-request.htmx-indicator {
    display: inline;
}
</style>

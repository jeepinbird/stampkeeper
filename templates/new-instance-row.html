{{define "new-instance-row.html"}}
<tr id="draft-row">
    <td>
        <select class="form-select instance-field" name="condition" form="new-instance-form">
            <option value="">No condition specified</option>
            <option value="Mint">Mint</option>
            <option value="Used">Used</option>
            <option value="Damaged">Damaged</option>
            <option value="Fine">Fine</option>
            <option value="Very Fine">Very Fine</option>
            <option value="Excellent">Excellent</option>
        </select>
    </td>
    <td>
        <input class="info-value-input instance-field"
               list="draft-box-options"
               name="box_name"
               form="new-instance-form"
               placeholder="Type or select a box"
               autocomplete="off">
        <datalist id="draft-box-options">
            {{range $.AllBoxes}}
            <option value="{{.Name}}" data-id="{{.ID}}"></option>
            {{end}}
        </datalist>
    </td>
    <td>
        <div class="quantity-controls justify-content-center">
            <input type="number"
                   class="quantity-input instance-field"
                   value="1"
                   min="1"
                   name="quantity"
                   form="new-instance-form">
        </div>
    </td>
    <td>
        <form id="new-instance-form"
              hx-post="/htmx/instances/{{.Stamp.ID}}"
              hx-target=".your-copies-section"
              hx-swap="outerHTML"
              hx-indicator="#save-instance-indicator">
            <button type="submit" class="btn btn-lg btn-link text-success p-0" title="Save Copy">
                <i class="bi bi-check2-square"></i>
            </button>
        </form>
        <div id="save-instance-indicator" class="htmx-indicator">
            <span class="spinner-border spinner-border-sm" role="status"></span>
        </div>
    </td>
</tr>

<style>
#save-instance-indicator {
    display: none;
    position: absolute;
}

#save-instance-indicator.htmx-request {
    display: inline-block;
}
</style>
{{end}}
